name: Build Android APK

# Builds a release APK in GitHub's cloud. Run it from the "Actions" tab
# (Run workflow) or push to main; download the APK from the run's Artifacts.
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Create Android platform files and icons
        run: |
          pip install pillow
          bash tool/setup_android.sh

      - name: Get packages
        run: flutter pub get

      # Analysis and tests are reported but do not stop the APK from building.
      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Unit tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: juz30-hifz-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
